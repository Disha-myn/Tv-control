<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Master Controller </title>
    <style>
        body { font-family: system-ui, sans-serif; padding: 20px; background: #121212; color: #fff; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
        .card { background: #1e1e1e; border-radius: 8px; padding: 15px; border: 1px solid #333; }
        .card h3 { margin-bottom: 10px; color: #00d2ff; }
        input, select, button { width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 10px; border-radius: 4px; border: none; box-sizing: border-box; }
        button { background: #00d2ff; color: #000; font-weight: bold; cursor: pointer; }
        button:hover { background: #0099cc; color: #fff; }
        .global-box { background: #2a2a2a; padding: 15px; border-radius: 8px; margin-bottom: 25px; border: 1px solid #444; }
        #app-content { display: none; }
    </style>
</head>
<body>

    <!-- SECURED APP CONTAINER -->
    <div id="app-content">
        <h1>📺 25 TV Global Cloud Dashboard</h1>

        <div class="global-box">
            <h3>Broadcast to ALL TVs</h3>
            <select id="global-type">
                <option value="mp4">Direct MP4 Video URL</option>
                <option value="youtube">YouTube Video URL / ID</option>
            </select>
            <input type="text" id="global-url" placeholder="Paste Video URL here...">
            <button onclick="sendToTv('ALL')">Update All 25 TVs</button>
        </div>

        <div class="grid" id="tv-grid"></div>
    </div>

    <script>
        // ==========================================
        // 1. DASHBOARD SECURITY PASSCODE
        // ==========================================
        const MASTER_PIN = "6391"; // Change this to your preferred PIN

        function authenticateUser() {
            if (sessionStorage.getItem("dashboard_auth") === "true") {
                document.getElementById("app-content").style.display = "block";
                return true;
            }

            const inputPin = prompt("🔒 Enter Master Passcode:");
            
            if (inputPin === MASTER_PIN) {
                sessionStorage.setItem("dashboard_auth", "true");
                document.getElementById("app-content").style.display = "block";
                return true;
            } else {
                alert("Incorrect Passcode. Access Denied.");
                document.body.innerHTML = `
                    <div style="text-align:center; margin-top: 20vh;">
                        <h1 style="color: #ff4d4d; font-size: 3rem;">403 - Unauthorized</h1>
                        <button onclick="location.reload()" style="width: auto; padding: 10px 20px; margin-top: 20px;">Try Again</button>
                    </div>`;
                return false;
            }
        }

        if (authenticateUser()) {
            
            // ==========================================
            // 2. PASTE YOUR JSONBIN CREDENTIALS HERE
            // ==========================================
            const BIN_ID = '6aa24839ffd5d16053f4d5c6'; 
            const API_KEY = '$2a$10$FLOXxg2zuz9FSbiliptPt.2WxFIkl9KI4S/mmerwO39qCwUj61Hqq';
            // ==========================================

            const grid = document.getElementById('tv-grid');

            for (let i = 1; i <= 25; i++) {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <h3>TV #${i}</h3>
                    <select id="type-${i}">
                        <option value="mp4">MP4 Video</option>
                        <option value="youtube">YouTube</option>
                    </select>
                    <input type="text" id="url-${i}" placeholder="Video Link...">
                    <button onclick="sendToTv('${i}')">Play on TV #${i}</button>
                `;
                grid.appendChild(card);
            }

            async function sendToTv(tvId) {
                let type = (tvId === 'ALL') ? document.getElementById('global-type').value : document.getElementById(`type-${tvId}`).value;
                let url = (tvId === 'ALL') ? document.getElementById('global-url').value : document.getElementById(`url-${tvId}`).value;

                if (!url) return alert('Please enter a video URL!');

                try {
                    const getRes = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                        headers: { 'X-Master-Key': API_KEY }
                    });
                    const currentData = await getRes.json();
                    let record = currentData.record || {};

                    record[`tv_${tvId}`] = { type, url };

                    await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-Master-Key': API_KEY
                        },
                        body: JSON.stringify(record)
                    });

                    alert(`Updated TV #${tvId} successfully!`);
                } catch (err) {
                    alert('Error updating cloud database. Verify your Bin ID and API Key.');
                }
            }

            window.sendToTv = sendToTv;
        }
    </script>
</body>
</html>
